[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "collapsiblepane"
version = "0.12.0"
description = "A sleek, customizable PySide6 widget for collapsible panels, inspired by JavaFX's TitledPane."
readme = "README.MD"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Muhammad Junaid Khalid", email = "mjk22071998@gmail.com" }
]
maintainers = [
    { name = "Muhammad Junaid Khalid", email = "mjk22071998@gmail.com" }
]
keywords = [
    "pyside6",
    "qt",
    "collapsible",
    "titledpane",
    "accordion",
    "gui",
    "widget",
    "desktop"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Widget Sets",
]
dependencies = [
    "PySide6>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt"
]

[project.urls]
Homepage = "https://github.com/mjk22071998/CollapsiblePane"
Repository = "https://github.com/mjk22071998/CollapsiblePane"
Issues = "https://github.com/mjk22071998/CollapsiblePane/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["collapsiblepane*"]

[tool.setuptools.package-data]
collapsiblepane = ["py.typed"]
